name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA (Unity 2022.3)
    runs-on: macos-15
    timeout-minutes: 300

    env:
      PROJECT: Unity-iPhone.xcodeproj
      SCHEME: Unity-iPhone
      IPA_NAME: NroNox.ipa

    steps:
      - name: Checkout (LFS pointers only)
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      # The 3 static libs in Libraries/ are ~260 MB of Git LFS data.
      # Cache them so repeat builds do not consume the monthly LFS bandwidth quota.
      - name: Compute static-lib cache key
        id: lfskey
        run: |
          KEY=$(cat Libraries/*.a | shasum -a 256 | cut -d' ' -f1)
          echo "key=nro-lfs-libs-$KEY" >> "$GITHUB_OUTPUT"

      - name: Restore static libraries from cache
        id: lfslibs
        uses: actions/cache/restore@v4
        with:
          path: Libraries/*.a
          key: ${{ steps.lfskey.outputs.key }}

      - name: Pull static libraries via Git LFS
        if: steps.lfslibs.outputs.cache-hit != 'true'
        run: |
          git lfs install --local
          git lfs pull --include="Libraries/*.a"
          ls -lh Libraries/*.a

      - name: Save static libraries to cache
        if: steps.lfslibs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Libraries/*.a
          key: ${{ steps.lfskey.outputs.key }}

      - name: Toolchain info
        run: |
          set -e
          uname -m
          xcodebuild -version
          xcodebuild -list -project "$PROJECT"
          df -h /

      - name: Build archive (unsigned)
        run: |
          set -o pipefail
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$OUT/NroNox.xcarchive" \
            -derivedDataPath "$OUT/DerivedData" \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_BITCODE=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            ENABLE_MODULE_VERIFIER=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$OUT/build.log"

      - name: Package unsigned IPA
        run: |
          set -e
          OUT="$RUNNER_TEMP/out"
          APP_PATH=$(find "$OUT/NroNox.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found in archive"
            exit 1
          fi
          echo "App bundle: $APP_PATH"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist" || true

          mkdir -p "$OUT/Payload"
          cp -R "$APP_PATH" "$OUT/Payload/"
          cd "$OUT"
          /usr/bin/zip -qry "$IPA_NAME" Payload
          du -h "$IPA_NAME"
          /usr/bin/unzip -l "$IPA_NAME" | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NroNox-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/out/NroNox.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: ${{ runner.temp }}/out/build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ipa-${{ github.run_number }}
        run: |
          OUT="$RUNNER_TEMP/out"
          gh release create "$TAG" "$OUT/$IPA_NAME" \
            --title "Nro Nox IPA - build ${{ github.run_number }}" \
            --notes "Unsigned IPA built from commit ${{ github.sha }}.

          Sign with Sideloadly / AltStore / ESign before installing on iPhone." \
          || gh release upload "$TAG" "$OUT/$IPA_NAME" --clobber
